<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" width="100%" height="100%">
  <defs>
    <style>
      .q-body { fill: none; stroke: #192024; stroke-width: 15; stroke-miterlimit: 10; }
      .q-slash { fill: none; stroke: #192024; stroke-width: 15; stroke-linecap: square; stroke-miterlimit: 10; }
      .q-orbit { fill: none; stroke: #54655B; stroke-width: 4.5; stroke-miterlimit: 10; }
      .q-electron { fill: #54655B; }
    </style>
  </defs>

  <g transform="translate(5, 5)">
    <!-- Orbit Ellipse -->
    <ellipse cx="80" cy="80" rx="72" ry="26" class="q-orbit" transform="rotate(-26 80 80)" />
    
    <!-- Electron dot on upper right of orbit -->
    <circle cx="128" cy="42" r="7.5" class="q-electron" />

    <!-- Main Q Circle -->
    <circle cx="80" cy="80" r="46" class="q-body" />

    <!-- Q Tail / Slash -->
    <line x1="64" y1="64" x2="114" y2="114" class="q-slash" />
  </g>
</svg>
